name: Irish Pub Simulator - ElevenLabs assets

# Runs only when the generation request changes. The API key stays in the
# ELEVENLABS_API_KEY repository secret; generated audio is committed back to the branch.
on:
  push:
    branches: [ccr-6928ea91-vu1bri, main]
    paths: ['pubsim/tools/elevenlabs/request.json']

permissions:
  contents: write

concurrency:
  group: pubsim-elevenlabs
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: pubsim
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Run ElevenLabs pipeline
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 tools/elevenlabs/el.py
      - name: Commit generated audio
        run: |
          git config user.name "pubsim-audio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/voice assets/sfx_el tools/elevenlabs/manifest.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing new to commit."; exit 0; fi
          git commit -m "Add ElevenLabs voice/SFX assets (generated in CI)"
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
