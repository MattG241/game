name: Scrape Revo gyms to Google Sheets

on:
  schedule:
    # Every hour, at 7 minutes past.
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: scrape-gyms
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Optional alternative to the Apps Script setup (scraper/apps_script.gs). Skipped unless the
    # repo variable ENABLE_GITHUB_SCRAPER is "true"; don't run both or every row is duplicated.
    if: ${{ vars.ENABLE_GITHUB_SCRAPER == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - name: Scrape and append to sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          SHEET_TAB: ${{ vars.SHEET_TAB }}
        run: python scraper/scrape_gyms.py
