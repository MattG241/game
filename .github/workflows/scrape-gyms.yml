name: Scrape Revo gyms to Google Sheets

on:
  schedule:
    # Times are UTC. These map to 6am, 10am, 2pm and 6pm Perth time (UTC+8).
    - cron: "7 22 * * *"
    - cron: "7 2 * * *"
    - cron: "7 6 * * *"
    - cron: "7 10 * * *"
  workflow_dispatch:

concurrency:
  group: scrape-gyms
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - name: Scrape and append to sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          SHEET_TAB: ${{ vars.SHEET_TAB }}
        run: python scraper/scrape_gyms.py
